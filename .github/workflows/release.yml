name: Release

# 推送 v* 标签时：跑测试 → 构建打包 → 安装包发布到 GitHub Releases
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest   # 需要较新的 Xcode 提供 Swift Testing（macOS 14 镜像默认版本过旧）
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: swift --version && xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Build and package
        run: ./build_app.sh

      - name: Verify codesign
        run: codesign --verify --strict build/FreedomPlayer.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/*.dmg
            build/dist/*.zip
          generate_release_notes: true
